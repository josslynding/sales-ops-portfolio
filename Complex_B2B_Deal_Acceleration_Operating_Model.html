 &lt;div class=&quot;m3-shell&quot;&gt;
  &lt;header class=&quot;m3-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;m3-kicker&quot;&gt;Portfolio case study&lt;/div&gt;&lt;h1&gt;Complex B2B Deal Acceleration Operating Model&lt;/h1&gt;&lt;p class=&quot;m3-muted&quot;&gt;A practical path from diagnosis to deal control and forecast visibility.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;m3-note&quot;&gt;&lt;b&gt;Anonymized data&lt;/b&gt;&lt;br&gt;Fictional deal data. All company names, client names and deal specifics have been generalized.&lt;/div&gt;&lt;/header&gt;

  &lt;section id=&quot;m3-diagnosis&quot; class=&quot;m3-panel m3-show&quot; role=&quot;tabpanel&quot;&gt;
   &lt;div class=&quot;m3-question&quot;&gt;&lt;strong&gt;Why might promising complex B2B deals fail to move faster, more visibly and with consistent quality?&lt;/strong&gt;&lt;span class=&quot;m3-chip m3-blue&quot;&gt;Start with why&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-goals&quot;&gt;
    &lt;article class=&quot;m3-goal&quot;&gt;&lt;div class=&quot;m3-goalhead&quot;&gt;SPEED · Why does progress slow?&lt;/div&gt;&lt;div class=&quot;m3-issue&quot;&gt;&lt;b&gt;The client is interested, but not fully committed.&lt;/b&gt;The expected return may not yet justify the budget, resources or priority required.&lt;div class=&quot;m3-tags&quot;&gt;Client + Sales&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;m3-issue&quot;&gt;&lt;b&gt;Both sides want the deal, but key expectations differ.&lt;/b&gt;Price, scope, technical requirements or timing may remain unresolved.&lt;div class=&quot;m3-tags&quot;&gt;Client + Partner&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article class=&quot;m3-goal&quot;&gt;&lt;div class=&quot;m3-goalhead&quot;&gt;VISIBILITY · Why is the next outcome unclear?&lt;/div&gt;&lt;div class=&quot;m3-issue&quot;&gt;&lt;b&gt;Teams do not share one definition of milestone completion.&lt;/b&gt;A stage may look advanced even though the evidence needed to exit it is missing.&lt;div class=&quot;m3-tags&quot;&gt;Shared process&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;m3-issue&quot;&gt;&lt;b&gt;The next action, owner or due date is not visible.&lt;/b&gt;A blocker can wait too long before anyone escalates it.&lt;div class=&quot;m3-tags&quot;&gt;SampleCorp orchestration&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article class=&quot;m3-goal&quot;&gt;&lt;div class=&quot;m3-goalhead&quot;&gt;QUALITY · Why does work need to be repeated?&lt;/div&gt;&lt;div class=&quot;m3-issue&quot;&gt;&lt;b&gt;The proposal reaches review before it is complete.&lt;/b&gt;Missing context or unclear requirements create avoidable questions and resubmission.&lt;div class=&quot;m3-tags&quot;&gt;Client + SampleCorp&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;m3-issue&quot;&gt;&lt;b&gt;Feedback is fragmented or lost between handoffs.&lt;/b&gt;Different interpretations create repeated revisions and weaken partner experience.&lt;div class=&quot;m3-tags&quot;&gt;Client + Partner + SampleCorp&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
   &lt;/div&gt;
   &lt;h2 class=&quot;m3-space&quot;&gt;Minimum evidence needed to validate the tree&lt;/h2&gt;
   &lt;div class=&quot;m3-tablebox&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Goal&lt;/th&gt;&lt;th&gt;Diagnostic question&lt;/th&gt;&lt;th&gt;Evidence needed&lt;/th&gt;&lt;th&gt;Analysis / baseline&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Speed&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Where do deals stall, and which blockers consume the most time?&lt;/td&gt;&lt;td&gt;Milestone entry/exit dates; standard blocker category; blocker start/end dates; responsible party&lt;/td&gt;&lt;td&gt;Milestone Median/P80/P90; blocker frequency, average resolution time and total waiting days&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Visibility&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Were missing decisions and blockers visible early enough?&lt;/td&gt;&lt;td&gt;Milestone dictionary; exit evidence; next action; action owner; decision owner; due date&lt;/td&gt;&lt;td&gt;Overdue and ownerless blocker rates; completeness of required evidence fields&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Quality&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Why were proposals or handoffs returned?&lt;/td&gt;&lt;td&gt;Submission completeness; feedback rounds; rework reason&lt;/td&gt;&lt;td&gt;First-time-right rate and avoidable rework rate&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
   &lt;p class=&quot;m3-muted m3-space&quot;&gt;Use historical data where available; establish missing evidence fields, standard blocker categories and baselines through the pilot.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section id=&quot;m3-model&quot; class=&quot;m3-panel&quot; role=&quot;tabpanel&quot;&gt;
   &lt;div class=&quot;m3-question&quot;&gt;&lt;strong&gt;How could one milestone framework connect the partner journey with SampleCorp's internal execution?&lt;/strong&gt;&lt;span class=&quot;m3-chip m3-blue&quot;&gt;Illustrative milestones&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-tablebox&quot;&gt;&lt;div class=&quot;m3-flow&quot;&gt;
    &lt;div class=&quot;m3-fh&quot;&gt;Milestone&lt;/div&gt;&lt;div class=&quot;m3-fh&quot;&gt;External partner journey&lt;/div&gt;&lt;div class=&quot;m3-fh&quot;&gt;SampleCorp internal action&lt;/div&gt;&lt;div class=&quot;m3-fh&quot;&gt;Exit evidence&lt;/div&gt;&lt;div class=&quot;m3-fh&quot;&gt;Action owner&lt;/div&gt;&lt;div class=&quot;m3-fh&quot;&gt;Decision owner&lt;/div&gt;&lt;div class=&quot;m3-fh&quot;&gt;Time benchmark&lt;/div&gt;
    &lt;div class=&quot;m3-ms&quot;&gt;M1 · Qualification&lt;/div&gt;&lt;div class=&quot;m3-ext&quot;&gt;Client and partner explore mutual value.&lt;/div&gt;&lt;div class=&quot;m3-int&quot;&gt;Validate business case, fit and commitment.&lt;/div&gt;&lt;div&gt;Value case accepted; decision-makers engaged.&lt;/div&gt;&lt;div&gt;Sales&lt;/div&gt;&lt;div&gt;Client + Partner&lt;/div&gt;&lt;div&gt;Median 12d&lt;br&gt;&lt;small&gt;P80 20d&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-ms&quot;&gt;M2 · Solution Design&lt;/div&gt;&lt;div class=&quot;m3-ext&quot;&gt;Client shapes the solution requirements.&lt;/div&gt;&lt;div class=&quot;m3-int&quot;&gt;Check required inputs before formal submission.&lt;/div&gt;&lt;div&gt;Complete scope, requirements, timeline and commercial assumptions.&lt;/div&gt;&lt;div&gt;Sales + Partner Manager&lt;/div&gt;&lt;div&gt;Client&lt;/div&gt;&lt;div&gt;Median 15d&lt;br&gt;&lt;small&gt;P80 24d&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-ms&quot;&gt;M3 · Negotiation&lt;/div&gt;&lt;div class=&quot;m3-ext&quot;&gt;Both sides resolve commercial and technical gaps.&lt;/div&gt;&lt;div class=&quot;m3-int&quot;&gt;Maintain one open-issues and decision log.&lt;/div&gt;&lt;div&gt;Material terms and solution direction accepted.&lt;/div&gt;&lt;div&gt;Sales + Partner Manager&lt;/div&gt;&lt;div&gt;Client + Partner&lt;/div&gt;&lt;div&gt;Median 28d&lt;br&gt;&lt;small&gt;P80 45d&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-ms&quot;&gt;M4 · Legal &amp;amp; Approval&lt;/div&gt;&lt;div class=&quot;m3-ext&quot;&gt;Parties confirm executable commitments.&lt;/div&gt;&lt;div class=&quot;m3-int&quot;&gt;Confirm final terms, finance inputs and signers.&lt;/div&gt;&lt;div&gt;Agreement approved and signature-ready.&lt;/div&gt;&lt;div&gt;Sales Operations&lt;/div&gt;&lt;div&gt;Authorized signers&lt;/div&gt;&lt;div&gt;Median 10d&lt;br&gt;&lt;small&gt;P80 16d&lt;/small&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-ms&quot;&gt;M5 · Handoff to Delivery&lt;/div&gt;&lt;div class=&quot;m3-ext&quot;&gt;Partnership moves into delivery and operations.&lt;/div&gt;&lt;div class=&quot;m3-int&quot;&gt;Transfer complete context, owners and dates.&lt;/div&gt;&lt;div&gt;Operations accepts the handoff first time.&lt;/div&gt;&lt;div&gt;Sales Operations&lt;/div&gt;&lt;div&gt;Operations owner&lt;/div&gt;&lt;div&gt;Median 5d&lt;br&gt;&lt;small&gt;P80 8d&lt;/small&gt;&lt;/div&gt;
   &lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;m3-tower&quot; class=&quot;m3-panel&quot; role=&quot;tabpanel&quot;&gt;
   &lt;div class=&quot;m3-question&quot;&gt;&lt;strong&gt;Deal Execution Control Tower · Exception-based review&lt;/strong&gt;&lt;span class=&quot;m3-chip m3-blue&quot;&gt;4 illustrative deals · $1.80M&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-stats&quot;&gt;&lt;div class=&quot;m3-stat&quot;&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;GREEN&lt;/span&gt;&lt;strong&gt;1 · $285k&lt;/strong&gt;&lt;span class=&quot;m3-muted&quot;&gt;No current blocker&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;m3-stat&quot;&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;WATCH&lt;/span&gt;&lt;strong&gt;2 · $1.10M&lt;/strong&gt;&lt;span class=&quot;m3-muted&quot;&gt;Blocker or evidence needs attention&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;m3-stat&quot;&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;RED&lt;/span&gt;&lt;strong&gt;1 · $410k&lt;/strong&gt;&lt;span class=&quot;m3-muted&quot;&gt;Blocker or milestone overdue&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-tablebox&quot;&gt;&lt;table style=&quot;min-width:1400px&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Deal&lt;/th&gt;&lt;th&gt;Value&lt;/th&gt;&lt;th&gt;Milestone&lt;/th&gt;&lt;th&gt;Client&lt;/th&gt;&lt;th&gt;Partner&lt;/th&gt;&lt;th&gt;Current blocker&lt;/th&gt;&lt;th&gt;Stage age&lt;/th&gt;&lt;th&gt;Blocker age&lt;/th&gt;&lt;th&gt;Next action&lt;/th&gt;&lt;th&gt;Action owner&lt;/th&gt;&lt;th&gt;Decision owner&lt;/th&gt;&lt;th&gt;Due&lt;/th&gt;&lt;th&gt;Health&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Client Alpha × Partner A&lt;/b&gt;&lt;/td&gt;&lt;td&gt;$620k&lt;/td&gt;&lt;td&gt;M3 Negotiation&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Watch&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Pricing &amp;amp; commercial terms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;34d · Median–P80&lt;/span&gt;&lt;/td&gt;&lt;td&gt;8d&lt;/td&gt;&lt;td&gt;Review two commercial options&lt;/td&gt;&lt;td&gt;Sales&lt;/td&gt;&lt;td&gt;Client sponsor&lt;/td&gt;&lt;td&gt;8 Sep&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Watch&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Client Beta × Partner B&lt;/b&gt;&lt;/td&gt;&lt;td&gt;$480k&lt;/td&gt;&lt;td&gt;M4 Legal &amp;amp; Approval&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Watch&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Signer confirmation&lt;/td&gt;&lt;td&gt;6d · ≤ Median&lt;/td&gt;&lt;td&gt;4d&lt;/td&gt;&lt;td&gt;Confirm signer and availability&lt;/td&gt;&lt;td&gt;Partner Manager&lt;/td&gt;&lt;td&gt;Partner authorized signer&lt;/td&gt;&lt;td&gt;7 Sep&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Watch&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Client Gamma × Partner C&lt;/b&gt;&lt;/td&gt;&lt;td&gt;$410k&lt;/td&gt;&lt;td&gt;M3 Negotiation&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;Red&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Watch&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Scope &amp;amp; deliverables alignment&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;49d · &amp;gt; P80&lt;/span&gt;&lt;/td&gt;&lt;td&gt;26d&lt;/td&gt;&lt;td&gt;Agree scope and feature set&lt;/td&gt;&lt;td&gt;Sales + Partner Manager&lt;/td&gt;&lt;td&gt;Client + Partner&lt;/td&gt;&lt;td&gt;6 Sep&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;Red&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Client Zeta × Partner Z&lt;/b&gt;&lt;/td&gt;&lt;td&gt;$285k&lt;/td&gt;&lt;td&gt;M5 Handoff to Delivery&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;td&gt;None&lt;/td&gt;&lt;td&gt;3d · ≤ Median&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;Complete planned handoff&lt;/td&gt;&lt;td&gt;Sales Operations&lt;/td&gt;&lt;td&gt;Operations owner&lt;/td&gt;&lt;td&gt;8 Sep&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Green&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
   &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;m3-forecast&quot; class=&quot;m3-panel&quot; role=&quot;tabpanel&quot;&gt;
   &lt;div class=&quot;m3-question&quot;&gt;&lt;strong&gt;Is the Sales target agreement date supported by commercial and milestone evidence?&lt;/strong&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-stats&quot;&gt;&lt;div class=&quot;m3-stat&quot;&gt;&lt;span class=&quot;m3-muted&quot;&gt;Sales forecast revenue&lt;/span&gt;&lt;strong&gt;$2.16M&lt;/strong&gt;&lt;span class=&quot;m3-muted&quot;&gt;All five deals submitted for the period&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;m3-stat&quot;&gt;&lt;span class=&quot;m3-muted&quot;&gt;Evidence-supported range&lt;/span&gt;&lt;strong&gt;$285k–$1.39M&lt;/strong&gt;&lt;span class=&quot;m3-muted&quot;&gt;Commit → Commit + Best Case&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;m3-stat&quot;&gt;&lt;span class=&quot;m3-muted&quot;&gt;Target-date gap / unsupported&lt;/span&gt;&lt;strong&gt;4 deals&lt;/strong&gt;&lt;span class=&quot;m3-muted&quot;&gt;Three delayed dates + one not calculable&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-rulegrid&quot;&gt;
    &lt;div class=&quot;m3-tablebox&quot;&gt;&lt;table style=&quot;min-width:920px&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Deal&lt;/th&gt;&lt;th&gt;Commercial evidence&lt;/th&gt;&lt;th&gt;Execution evidence&lt;/th&gt;&lt;th&gt;Sales target agreement date&lt;/th&gt;&lt;th&gt;Evidence-supported date&lt;/th&gt;&lt;th&gt;Projected cycle position&lt;/th&gt;&lt;th&gt;Forecast category&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
     &lt;tr&gt;&lt;td&gt;Client Zeta × Partner Z&lt;/td&gt;&lt;td&gt;Value accepted; decision-makers engaged&lt;/td&gt;&lt;td&gt;All required gates complete&lt;/td&gt;&lt;td&gt;12 Sep&lt;/td&gt;&lt;td&gt;12 Sep&lt;/td&gt;&lt;td&gt;≤ Median&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Commit&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Client Alpha × Partner A&lt;/td&gt;&lt;td&gt;Strong interest; budget pending&lt;/td&gt;&lt;td&gt;One dated blocker remains&lt;/td&gt;&lt;td&gt;18 Sep&lt;/td&gt;&lt;td&gt;25 Sep&lt;/td&gt;&lt;td&gt;Median–P80&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Best Case&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Client Beta × Partner B&lt;/td&gt;&lt;td&gt;Terms accepted; signer pending&lt;/td&gt;&lt;td&gt;Signer confirmation has a dated action&lt;/td&gt;&lt;td&gt;14 Sep&lt;/td&gt;&lt;td&gt;18 Sep&lt;/td&gt;&lt;td&gt;Median–P80&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Best Case&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Client Gamma × Partner C&lt;/td&gt;&lt;td&gt;Intent confirmed; scope unresolved&lt;/td&gt;&lt;td&gt;Critical milestone beyond P80&lt;/td&gt;&lt;td&gt;15 Sep&lt;/td&gt;&lt;td&gt;8 Oct&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;&amp;gt; P80&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;At Risk&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
     &lt;tr&gt;&lt;td&gt;Client Delta × Partner D&lt;/td&gt;&lt;td&gt;Interest expressed; M1 exit evidence absent&lt;/td&gt;&lt;td&gt;Qualification, sponsor and decision path not validated&lt;/td&gt;&lt;td&gt;30 Sep&lt;/td&gt;&lt;td&gt;Not calculable&lt;/td&gt;&lt;td&gt;Not benchmarked&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;m3-chip m3-blue&quot;&gt;Pipeline&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-rules&quot;&gt;
     &lt;div class=&quot;m3-rule&quot;&gt;&lt;span class=&quot;m3-chip m3-green&quot;&gt;Commit&lt;/span&gt;&lt;div&gt;Commercial commitment is evidenced, required gates are complete, and the supported date falls in the forecast period.&lt;/div&gt;&lt;/div&gt;
     &lt;div class=&quot;m3-rule&quot;&gt;&lt;span class=&quot;m3-chip m3-watch&quot;&gt;Best Case&lt;/span&gt;&lt;div&gt;The opportunity is credible, but one material commitment or milestone is still pending.&lt;/div&gt;&lt;/div&gt;
     &lt;div class=&quot;m3-rule&quot;&gt;&lt;span class=&quot;m3-chip m3-red&quot;&gt;At Risk&lt;/span&gt;&lt;div&gt;The current target date is not supported by the remaining critical path or an overdue blocker.&lt;/div&gt;&lt;/div&gt;
     &lt;div class=&quot;m3-rule&quot;&gt;&lt;span class=&quot;m3-chip m3-blue&quot;&gt;Pipeline&lt;/span&gt;&lt;div&gt;Commercial interest exists, but commitment evidence is not yet sufficient for a dated forecast.&lt;/div&gt;&lt;/div&gt;
     &lt;div class=&quot;m3-formula&quot;&gt;&lt;b&gt;Evidence-supported agreement date&lt;/b&gt;&lt;p&gt;Latest committed next-action date + median time for remaining milestones + adjustment for overdue blockers.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;
   &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;m3-roadmap&quot; class=&quot;m3-panel&quot; role=&quot;tabpanel&quot;&gt;
   &lt;div class=&quot;m3-question&quot;&gt;&lt;strong&gt;How could the model be validated and introduced without creating a heavy transformation project?&lt;/strong&gt;&lt;span class=&quot;m3-chip m3-blue&quot;&gt;6-month pilot&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;m3-road&quot;&gt;
    &lt;div class=&quot;m3-phase&quot;&gt;&lt;h3&gt;Month 1 · Understand&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Learn the business and partner journey&lt;/li&gt;&lt;li&gt;Interview key stakeholders&lt;/li&gt;&lt;li&gt;Map current decision points&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;m3-output&quot;&gt;&lt;b&gt;Output:&lt;/b&gt; initial journey + hypotheses&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-phase&quot;&gt;&lt;h3&gt;Month 2 · Diagnose&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Audit historical data quality&lt;/li&gt;&lt;li&gt;Review representative deals&lt;/li&gt;&lt;li&gt;Identify process and data gaps&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;m3-output&quot;&gt;&lt;b&gt;Output:&lt;/b&gt; data readiness + validated issue tree&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-phase&quot;&gt;&lt;h3&gt;Month 3 · Build foundation&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Agree milestone dictionary&lt;/li&gt;&lt;li&gt;Define exit evidence and owners&lt;/li&gt;&lt;li&gt;Define standard blocker categories&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;m3-output&quot;&gt;&lt;b&gt;Output:&lt;/b&gt; operating rules + pilot data structure&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-phase&quot;&gt;&lt;h3&gt;Months 4–5 · Pilot&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Run the Control Tower&lt;/li&gt;&lt;li&gt;Capture stage and blocker history&lt;/li&gt;&lt;li&gt;Compare Sales and evidence dates&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;m3-output&quot;&gt;&lt;b&gt;Output:&lt;/b&gt; initial baseline + blocker patterns&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;m3-phase&quot;&gt;&lt;h3&gt;Month 6 · Calibrate&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Refine thresholds and ownership&lt;/li&gt;&lt;li&gt;Measure pilot outcomes&lt;/li&gt;&lt;li&gt;Decide how to scale&lt;/li&gt;&lt;/ul&gt;&lt;div class=&quot;m3-output&quot;&gt;&lt;b&gt;Output:&lt;/b&gt; validated model + scale recommendation&lt;/div&gt;&lt;/div&gt;
   &lt;/div&gt;
   &lt;h2 class=&quot;m3-space&quot;&gt;Success measures&lt;/h2&gt;
   &lt;div class=&quot;m3-kpis&quot;&gt;&lt;div class=&quot;m3-kpi&quot;&gt;&lt;h3&gt;Speed&lt;/h3&gt;&lt;p&gt;Median Negotiation-to-Handoff Cycle Time&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;m3-kpi&quot;&gt;&lt;h3&gt;Visibility &amp;amp; predictability&lt;/h3&gt;&lt;p&gt;Primary: Forecast Agreement-Date Accuracy&lt;/p&gt;&lt;p class=&quot;m3-muted&quot;&gt;Secondary: Revenue Forecast Accuracy&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;m3-kpi&quot;&gt;&lt;h3&gt;Quality&lt;/h3&gt;&lt;p&gt;First-Time-Right Handoff Rate&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
